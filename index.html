            <h1 class="font-bold text-3xl">My plants</h1>
            <button id="button-add-plant" class="rounded-3xl text-white text-sm/4 bg-neutral-600 hover:bg-neutral-700 px-8 py-2">Add plant</button>
        </header>

        <main class="p-6">
            <section id="start-page" class="hidden mt-6 text-center font-bold text-2xl text-neutral-600/50">You don't have any plants yet</section>

            </section>
            <section id="form-modal-window" class="hidden fixed bg-neutral-700/90 top-0 left-0 z-100 w-full h-full flex justify-center items-center">
                <form name="new-plant-form" class="new-plant-form border border-black rounded-3xl p-4 bg-white w-full mx-6 max-w-2xl min-w-xl">
                    <h2 class="font-bold text-2xl">New plant</h2>
                    <div class="grid sm:grid-cols-2 my-4 gap-4">
                        <p>
                            <label for="inputName">Name of the plant</label>
                            <input type="text" name="plantName" id="inputName" 
                                placeholder="Monstera deliciosa" maxlength="30"
                                class="border border-black rounded-lg text-sm w-full p-2">
                        </p>
                        <p>
                            <label for="selectIcon">Icon</label>
                            <select name="plantIcon" id="selectIcon" 
                            class="border border-black rounded-lg text-sm/5 w-full p-2 appearance-none">
                                <option value="">Please choose an icon</option>
                                <option value="🪴">🪴</option>
                                <option value="🌵">🌵</option>
                                <option value="🌴">🌴</option>
                                <option value="🌳">🌳</option>
                                <option value="🌱">🌱</option>
                                <option value="🪻">🪻</option>
                                <option value="🌿">🌿</option>
                                <option value="🌸">🌸</option>
                                <option value="🍋">🍋</option>
                                <option value="🌲">🌲</option>
                                <option value="🌾">🌾</option>
                                <option value="🌺">🌺</option>
                                <option value="🍀">🍀</option>
                                <option value="🎋">🎋</option>
                                <option value="🌷">🌷</option>
                                <option value="🥑">🥑</option>
                                <option value="🥬">🥬</option>
                            </select>
                        </p>
                        <p>
                            <label for="inputPeriod">Watering period in days</label>
                            <input type="number" name="waterPeriod" id="inputPeriod" 
                                placeholder="7" min="1"
                                class="border border-black rounded-lg text-sm w-full p-2">
                        </p>
                        <p>
                            <label for="inputDate">Last watering</label>
                            <input type="date" name="lastWaterDate" id="inputDate" min="2025-06-01"
                            class="border border-black rounded-lg text-sm/4 w-full p-2 appearance-none">
                        </p>
                    </div>
                    <div class="mt-6 mb-4 flex gap-4 justify-center sm:justify-end">
                        <button type="button" class="buttonCancelForm w-32 rounded-3xl text-white text-sm/4 text-center bg-neutral-600 hover:bg-neutral-700 px-8 py-2">Cancel</button>
                        <button type="submit" class="w-32 rounded-3xl text-white text-sm/4 text-center bg-neutral-600 hover:bg-neutral-700 px-8 py-2">Save</button>
                    </div>
                </form>
            </section>
        </main>
    </body>
